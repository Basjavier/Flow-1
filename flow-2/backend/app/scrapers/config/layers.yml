# Configuración del scraper WFS de zonificación (IDE Chile / Geoportal MINVU).
#
# El dato de zonificación (Plan Regulador Comunal) lo publica el Geoportal Open
# Data MINVU (https://ide.minvu.cl), que corre sobre GeoNode. OJO: las capas son
# POR COMUNA, no hay una sola capa nacional. El visor expone aliases tipo
# "MINVU::prc-las-condes-3"; el typename real del WFS hay que confirmarlo.
#
# CÓMO VALIDAR (desde tu PC, que sí tiene acceso a los endpoints chilenos):
#
#   # 1) Listar las capas reales y encontrar el typename de tu comuna:
#   python standalone-tools/validar_ide.py --capabilities \
#       --url https://ide.minvu.cl/geoserver/ows
#
#   # 2) Consultar un punto y ver qué campos trae (para mapearlos abajo):
#   python standalone-tools/validar_ide.py \
#       --typename <typename_real> --lat -33.4096 --lon -70.5681 --save
#
# Recién con esa salida confirmá/corregí 'wfs_base_url', el 'typename' y el mapa
# de 'campos'. Mientras tanto los valores de abajo son CANDIDATOS sin validar.

wfs_base_url: "https://ide.minvu.cl/geoserver/ows"
default_srs: "EPSG:4326"
# GeoNode/PostGIS suele nombrar la columna de geometría 'the_geom' (confirmar).
geom_field: "the_geom"

capas:
  zonificacion:
    # MINVU publica una capa de zonificación POR COMUNA. La clave es la comuna
    # normalizada (minúsculas, sin tildes, espacios -> _). Todos los typenames
    # son candidatos — confirmar cada uno con --capabilities.
    typename_por_comuna:
      las_condes: "geonode:prc_las_condes"
      maipu: "geonode:prc_maipu"
      san_bernardo: "geonode:prc_san_bernardo"
    # Fallback si la comuna no está mapeada (dejar vacío para fallar explícito).
    typename_default: ""
    # Mapea campo del WFS -> campo del CIP en el JSON de la propiedad.
    # Los nombres de origen son adivinados; ajustalos con la salida de validar_ide.
    campos:
      zona: "zona"
      altura_maxima_m: "altura_max"
      coef_ocupacion_suelo: "coef_ocup_suelo"
      coef_constructibilidad: "coef_constru"
      uso_permitido: "usos"
