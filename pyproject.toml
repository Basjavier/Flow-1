[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-agent"
version = "0.1.0"
description = "Automated scraping, scoring, and alerting for the Chilean property market"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # Scraping
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Scheduling
    "apscheduler>=3.10.4",
    # Logging
    "structlog>=24.2.0",
    # AI
    "anthropic>=0.28.0",
    # PDF
    "reportlab>=4.2.0",
    # CLI / charts
    "rich>=13.7",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
# After install: run `rea-top20` from anywhere
rea-top20 = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "scraper*",
    "scoring*",
    "database*",
    "api*",
    "scheduler*",
    "reports*",
    "remates*",
    "data*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
