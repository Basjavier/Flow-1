[project]
name = "fallen-angels"
version = "0.1.0"
description = "Operational stack for fallen-angel long/short credit trades"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "xbbg>=0.7.7",
    "blpapi>=3.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.20",
    "streamlit>=1.33",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fallen_angels"]

# blpapi is published on Bloomberg's own package index, not PyPI. Declaring it
# here lets `uv sync` resolve the wheel. The BLPAPI C++ SDK must already be
# installed on the host (it is part of a standard Terminal install).
[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = true

[tool.uv.sources]
blpapi = { index = "bloomberg" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
